
<!DOCTYPE html>
<html>
<head>
    <title>TaskFlow - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
    <h2>✦ TaskFlow</h2>
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="tasks.html">My Tasks</a>
    <a href="calendar.html">Calendar</a>
    <a href="notes.html">Notes</a>
    <a href="timer.html">Focus Timer</a>
    <a href="settings.html">Settings</a>
</div>

<div class="main">
    <header>
        <h2>Home</h2>
        <button onclick="toggleTheme()">Change Theme</button>
    </header>

    <div class="welcome">
        <h1>Welcome to TaskFlow! 👋</h1>
        <p>Organize your day and achieve your goals.</p>
        <a href="tasks.html" class="btn">View My Tasks</a>
    </div>

    <h2>Your Overview</h2>

    <div class="stats">
        <div class="card">
            <h3>Total Tasks</h3>
            <h1 id="total">0</h1>
        </div>

        <div class="card">
            <h3>Completed</h3>
            <h1 id="done">0</h1>
        </div>

        <div class="card">
            <h3>In Progress</h3>
            <h1 id="doing">0</h1>
        </div>
    </div>

    <div class="card">
        <h3>Daily Progress</h3>
        <div class="progress">
            <div id="progress-bar"></div>
        </div>
        <p id="progress-text">0% Completed</p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
